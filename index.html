<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gewicht Mania</title>
    <meta name="description" content="Duel de trains à 2 joueurs, jouable dans le navigateur. Solo contre le bot ou en ligne avec un code de partie." />

    <!-- Browser tab, bookmarks, Windows shortcuts. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />

    <!-- iOS home screen: Safari reads this one, and ignores the manifest icons. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Gewicht Mania" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Android home screen and the installed-app name. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#12305f" />

    <!--
      Link previews. Crawlers do not resolve relative URLs, so og:image and og:url
      are absolute and have to be updated if the site ever moves.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gewicht Mania" />
    <meta property="og:title" content="Gewicht Mania" />
    <meta property="og:description" content="Duel de trains à 2 joueurs, jouable dans le navigateur. Solo contre le bot ou en ligne avec un code de partie." />
    <meta property="og:url" content="https://raphaeltamayo.github.io/gewicht-mania/" />
    <meta property="og:image" content="https://raphaeltamayo.github.io/gewicht-mania/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nez d'un TGV Duplex, titre Gewicht Mania" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
